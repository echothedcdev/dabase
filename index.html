<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dabase</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 7%;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #58a6ff;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      cursor: pointer;
      color: white;
      background: #238636;
      font-weight: bold;
    }

    button:hover {
      background: #2ea043;
    }

    .blue {
      background: #1f6feb;
    }

    .blue:hover {
      background: #388bfd;
    }

    .danger {
      background: #da3633;
    }

    main {
      max-width: 950px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #8b949e;
      font-size: 18px;
    }

    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .panel h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #58a6ff;
    }

    .code-input {
      text-align: center;
      font-size: 28px;
      letter-spacing: 8px;
    }

    .message {
      color: #8b949e;
      margin-top: 12px;
    }

    .success {
      color: #3fb950;
    }

    .error {
      color: #ff7b72;
    }

    .file-upload {
      border: 2px dashed #30363d;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-top: 20px;
    }

    .file-upload p {
      color: #8b949e;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #8b949e;
      border-top: 1px solid #30363d;
      margin-top: 50px;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 20px;
      }

      .hero h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    📦 <span>Dabase</span>
  </div>

  <div>

    <button
      id="loginButton"
      class="blue"
      onclick="showLogin()">
      Login
    </button>

    <button
      id="logoutButton"
      class="danger hidden"
      onclick="logout()">
      Logout
    </button>

  </div>

</header>


<main>

  <section class="hero">

    <h1>Dabase</h1>

    <p>
      Simple file storage for your projects.
    </p>

  </section>


  <!-- LOGIN -->

  <section
    id="loginPanel"
    class="panel hidden">

    <h2>Login</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email">

    <input
      id="loginPassword"
      type="password"
      placeholder="Password">

    <button
      class="blue"
      onclick="login()">
      Login
    </button>

    <button onclick="showSignup()">
      Create Account
    </button>

    <p
      id="loginMessage"
      class="message">
    </p>

  </section>


  <!-- SIGNUP -->

  <section
    id="signupPanel"
    class="panel hidden">

    <h2>Create Account</h2>

    <input
      id="signupUsername"
      type="text"
      placeholder="Username">

    <input
      id="signupEmail"
      type="email"
      placeholder="Email">

    <input
      id="signupPassword"
      type="password"
      placeholder="Password">

    <button
      class="blue"
      onclick="signup()">
      Create Account
    </button>

    <p
      id="signupMessage"
      class="message">
    </p>

  </section>


  <!-- EMAIL VERIFICATION -->

  <section
    id="verifyPanel"
    class="panel hidden">

    <h2>📧 Verify Your Email</h2>

    <p>
      We've sent a 6-digit verification code to:
    </p>

    <strong id="verificationEmail">
      your email
    </strong>

    <input
      id="verificationCode"
      class="code-input"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="000000">

    <button
      class="blue"
      onclick="verifyCode()">
      Verify Email
    </button>

    <button
      onclick="resendCode()">
      Resend Code
    </button>

    <p
      id="verifyMessage"
      class="message">
    </p>

  </section>


  <!-- DASHBOARD -->

  <section
    id="dashboard"
    class="panel hidden">

    <h2>📁 Your Files</h2>

    <p id="accountInfo">
      Logged in
    </p>


    <div class="file-upload">

      <h3>Upload a File</h3>

      <p>
        Choose a file to upload to your Dabase account.
      </p>

      <input
        id="fileInput"
        type="file">

      <br><br>

      <button
        class="blue"
        onclick="uploadFile()">
        Upload File
      </button>

      <p
        id="uploadMessage"
        class="message">
      </p>

    </div>

  </section>

</main>


<footer>
  Dabase • File Storage
</footer>


<script>

/*
==================================================
BACKEND CONFIGURATION
==================================================

Put your public Supabase URL and public/publishable
key here when you connect your backend.

NEVER put a Supabase service-role key here.
*/

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";


/*
==================================================
SHOW / HIDE PANELS
==================================================
*/

function hidePanels() {

  document
    .querySelectorAll(".panel")
    .forEach(panel => {
      panel.classList.add("hidden");
    });

}


function showLogin() {

  hidePanels();

  document
    .getElementById("loginPanel")
    .classList.remove("hidden");

}


function showSignup() {

  hidePanels();

  document
    .getElementById("signupPanel")
    .classList.remove("hidden");

}


/*
==================================================
SIGN UP
==================================================
*/

async function signup() {

  const username =
    document.getElementById("signupUsername").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const message =
    document.getElementById("signupMessage");


  if (!username || !email || !password) {

    message.textContent =
      "Please fill out every field.";

    message.className =
      "message error";

    return;
  }


  /*
    BACKEND TODO:

    1. Create the user.
    2. Generate a random 6-digit code.
    3. Store a hashed version of the code.
    4. Send the code to the email.
    5. Set an expiration time.
  */


  document
    .getElementById("verificationEmail")
    .textContent = email;


  hidePanels();

  document
    .getElementById("verifyPanel")
    .classList.remove("hidden");


  message.textContent =
    "Verification code requested.";

}


/*
==================================================
VERIFY EMAIL
==================================================
*/

async function verifyCode() {

  const code =
    document
      .getElementById("verificationCode")
      .value
      .trim();

  const message =
    document.getElementById("verifyMessage");


  if (!/^[0-9]{6}$/.test(code)) {

    message.textContent =
      "Enter the 6-digit code from your email.";

    message.className =
      "message error";

    return;
  }


  /*
    BACKEND TODO:

    Send the code to your backend.

    The backend should:

    - Check the code.
    - Check expiration.
    - Mark the email as verified.
    - Invalidate the code.
  */


  message.textContent =
    "The verification backend has not been connected yet.";

  message.className =
    "message";
}


/*
==================================================
RESEND CODE
==================================================
*/

async function resendCode() {

  const email =
    document
      .getElementById("verificationEmail")
      .textContent;

  const message =
    document.getElementById("verifyMessage");


  /*
    BACKEND TODO:

    Ask the backend to generate and send
    a new verification code.
  */


  message.textContent =
    "A new verification code will be sent once the email backend is connected.";

}


/*
==================================================
LOGIN
==================================================
*/

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");


  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    message.className =
      "message error";

    return;
  }


  /*
    BACKEND TODO:

    Authenticate the user with Supabase.
  */


  message.textContent =
    "Login backend has not been connected yet.";

}


/*
==================================================
UPLOAD
==================================================
*/

async function uploadFile() {

  const file =
    document
      .getElementById("fileInput")
      .files[0];

  const message =
    document.getElementById("uploadMessage");


  if (!file) {

    message.textContent =
      "Choose a file first.";

    return;
  }


  /*
    BACKEND TODO:

    Upload the file to private storage
    belonging to the logged-in user.
  */


  message.textContent =
    "File storage backend has not been connected yet.";

}


/*
==================================================
LOGOUT
==================================================
*/

function logout() {

  hidePanels();

  document
    .getElementById("logoutButton")
    .classList.add("hidden");

  document
    .getElementById("loginButton")
    .classList.remove("hidden");

}

</script>

</body>
</html>
